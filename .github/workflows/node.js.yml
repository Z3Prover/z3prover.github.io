# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [12.x, 14.x, 16.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v3
    - name: Detect package metadata
      id: package
      run: |
        if [ -f package.json ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi
        if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ] || [ -f yarn.lock ]; then
          echo "has-lock=true" >> "$GITHUB_OUTPUT"
        else
          echo "has-lock=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: ${{ steps.package.outputs.has-lock == 'true' && 'npm' || '' }}
    - name: Verify static site files
      if: ${{ steps.package.outputs.exists != 'true' }}
      run: |
        test -f index.html
        test -f tutorial/guide.html
    - name: Build and test package
      if: ${{ steps.package.outputs.exists == 'true' }}
      run: |
        npm i
        npm run build
        cp -r dist/. z3-wasm/.
        npx parcel z3-wasm/guide.html
        npm test
